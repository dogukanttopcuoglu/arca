services:
  firecrawl-pdf-service:
    build:
      context: ./services/firecrawl
      dockerfile: Dockerfile
    container_name: firecrawl-pdf-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: arca-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: arca-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  arca-pdf-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arca-pdf-inspector
    depends_on:
      - firecrawl-pdf-service
    environment:
      - FIRECRAWL_BASE_URL=http://firecrawl-pdf-service:3002
    restart: "no"

volumes:
  ollama-models:
  qdrant-storage:
